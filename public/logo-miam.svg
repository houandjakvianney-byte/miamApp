<svg viewBox="0 0 200 200" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bellGradient" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#ff9944;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#f97316;stop-opacity:1" />
    </linearGradient>
    <filter id="shadow" x="-50%" y="-50%" width="200%" height="200%">
      <feDropShadow dx="0" dy="4" stdDeviation="4" flood-opacity="0.2"/>
    </filter>
  </defs>

  <!-- Ombre douce -->
  <ellipse cx="100" cy="175" rx="55" ry="12" fill="#000000" opacity="0.1"/>

  <!-- Corps principal de la cloche -->
  <path d="M 70 50 Q 50 60 50 90 Q 50 120 60 140 Q 65 155 100 160 Q 135 155 140 140 Q 150 120 150 90 Q 150 60 130 50 Z" 
        fill="url(#bellGradient)" stroke="#000000" stroke-width="3" stroke-linejoin="round" filter="url(#shadow)"/>

  <!-- Ligne de séparation sur la cloche (noir) -->
  <path d="M 70 95 Q 100 100 130 95" 
        fill="none" stroke="#000000" stroke-width="2.5" stroke-linecap="round" opacity="0.6"/>

  <!-- Anneau supérieur (noir) -->
  <rect x="85" y="28" width="30" height="18" rx="4" 
        fill="#000000" stroke="#000000" stroke-width="1"/>

  <!-- Détail intérieur anneau -->
  <rect x="88" y="32" width="24" height="10" rx="2" 
        fill="none" stroke="#f97316" stroke-width="1.5" opacity="0.7"/>

  <!-- Battant/clapper (noir) -->
  <g>
    <!-- Tige -->
    <line x1="100" y1="160" x2="100" y2="172" stroke="#000000" stroke-width="2.5" stroke-linecap="round"/>
    <!-- Boule -->
    <circle cx="100" cy="180" r="10" fill="#000000" stroke="#000000" stroke-width="1"/>
    <!-- Highlight sur la boule -->
    <circle cx="97" cy="177" r="2.5" fill="#f97316" opacity="0.6"/>
  </g>

  <!-- Points décoratifs oranges (effet brillance) -->
  <circle cx="75" cy="70" r="1.5" fill="#ff9944" opacity="0.8"/>
  <circle cx="125" cy="65" r="1" fill="#ff9944" opacity="0.6"/>
  <circle cx="100" cy="50" r="1.2" fill="#ff9944" opacity="0.7"/>

  <!-- Arc intérieur (ombre subtile) -->
  <path d="M 75 60 Q 100 45 125 60" 
        fill="none" stroke="#000000" stroke-width="1.5" opacity="0.15"/>
</svg>